<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Responses Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #236383 0%, #007E8C 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #236383;
            margin-bottom: 30px;
            text-align: center;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #236383 0%, #007E8C 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(35, 99, 131, 0.3);
        }

        .org-card {
            background: white;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 20px;
            border: 2px solid #e2e8f0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: box-shadow 0.2s;
        }

        .org-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .card-header {
            background: linear-gradient(135deg, #236383 0%, #007E8C 100%);
            color: white;
            padding: 20px 25px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header:hover {
            background: linear-gradient(135deg, #1e5470 0%, #006875 100%);
        }

        .org-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .response-count {
            font-size: 12px;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .email-button {
            background: #FBAD3F;
            color: #1a202c;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .email-button:hover {
            background: #f59e0b;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(251, 173, 63, 0.4);
        }

        .expand-icon {
            font-size: 24px;
            transition: transform 0.3s;
        }

        .expand-icon.expanded {
            transform: rotate(180deg);
        }

        .card-body {
            padding: 25px;
            background: #f7fafc;
            display: none;
        }

        .card-body.expanded {
            display: block;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-section {
            background: white;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid #FBAD3F;
        }

        .info-section-title {
            color: #236383;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-item {
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.6;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            color: #2d3748;
            display: inline-block;
            min-width: 100px;
        }

        .info-value {
            color: #4a5568;
        }

        .info-value.empty {
            color: #cbd5e0;
            font-style: italic;
        }

        .schedule-grid {
            display: grid;
            gap: 12px;
        }

        .schedule-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #FBAD3F;
        }

        .schedule-label {
            font-weight: 600;
            color: #236383;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .schedule-value {
            color: #4a5568;
            font-size: 14px;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-icon {
            min-width: 20px;
        }

        .impact-story {
            background: linear-gradient(135deg, #fff5e6 0%, #ffe6cc 100%);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #FBAD3F;
            margin-top: 20px;
        }

        .impact-story-title {
            color: #236383;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .impact-story-text {
            color: #2d3748;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .timestamp-badge {
            background: #edf2f7;
            color: #236383;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            margin-top: 8px;
        }

        .multiple-responses {
            background: #fff5e6;
            border-left: 4px solid #FBAD3F;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .multiple-responses-title {
            font-weight: 600;
            color: #744210;
            margin-bottom: 8px;
        }

        .response-list {
            font-size: 13px;
            color: #744210;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        #exportCSV {
            background: #48bb78;
        }

        #exportCSV:hover {
            background: #38a169;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Partner Organizations</h1>

        <div class="controls">
            <button onclick="loadResponses()">🔄 Refresh</button>
            <button id="exportCSV" onclick="exportToCSV()">📊 Export to CSV</button>
        </div>

        <div id="responseContainer">
            <div class="loading">Loading responses...</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBJ9sUwY_gw2bYWXCffV0RKuQkXqRq-hTU",
            authDomain: "recipient-survey.firebaseapp.com",
            databaseURL: "https://recipient-survey-default-rtdb.firebaseio.com",
            projectId: "recipient-survey",
            storageBucket: "recipient-survey.firebasestorage.app",
            messagingSenderId: "1023665626622",
            appId: "1:1023665626622:web:6c9be3dcaddeec30d674af",
            measurementId: "G-CQY41G3NW6"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allResponses = [];
        let organizationData = {};

        function escapeHTML(value) {
            if (value === null || value === undefined) return '';
            return value.toString().replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function safeWebsiteUrl(value) {
            if (!value) return '';

            const raw = value.toString().trim();
            const urlWithProtocol = /^[a-zA-Z][a-zA-Z\d+.-]*:/.test(raw) ? raw : `https://${raw}`;

            try {
                const url = new URL(urlWithProtocol);
                if (url.protocol === 'http:' || url.protocol === 'https:') {
                    return url.href;
                }
            } catch (error) {
                return '';
            }

            return '';
        }

        function loadResponses() {
            const container = document.getElementById('responseContainer');
            container.innerHTML = '<div class="loading">Loading responses...</div>';

            database.ref('survey-responses').once('value')
                .then(snapshot => {
                    allResponses = [];
                    organizationData = {};
                    const data = snapshot.val();

                    if (!data) {
                        container.innerHTML = '<div class="loading">No responses yet.</div>';
                        return;
                    }

                    // Convert to array
                    Object.keys(data).forEach(key => {
                        allResponses.push({
                            id: key,
                            ...data[key]
                        });
                    });

                    // Sort by timestamp (newest first)
                    allResponses.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                    // Group by organization
                    allResponses.forEach(response => {
                        const orgName = response.orgName || 'Unknown Organization';
                        if (!organizationData[orgName]) {
                            organizationData[orgName] = [];
                        }
                        organizationData[orgName].push(response);
                    });

                    displayResponses();
                })
                .catch(error => {
                    container.innerHTML = `<div class="error">Error loading responses: ${escapeHTML(error.message)}</div>`;
                });
        }

        function displayResponses() {
            const container = document.getElementById('responseContainer');

            if (allResponses.length === 0) {
                container.innerHTML = '<div class="loading">No responses yet.</div>';
                return;
            }

            container.innerHTML = '';

            // Sort organizations alphabetically
            const sortedOrgs = Object.keys(organizationData).sort();

            sortedOrgs.forEach(orgName => {
                const responses = organizationData[orgName];
                const latestResponse = responses[0]; // Most recent response

                const card = document.createElement('div');
                card.className = 'org-card';

                // Merge data from all responses (latest takes precedence)
                const mergedData = mergeResponses(responses);
                const primaryContactMethod = mergedData.primaryContactMethod || mergedData.contactMethod;
                const backupContactMethod = mergedData.backupContactMethod;
                const websiteUrl = safeWebsiteUrl(mergedData.website);

                let html = `
                    <div class="card-header" onclick="toggleCard(this)">
                        <div>
                            <div class="org-title">${escapeHTML(orgName)}</div>
                            <div class="response-count">${responses.length} response${responses.length > 1 ? 's' : ''}</div>
                        </div>
                        <div class="header-actions">
                            <button class="email-button" data-org-name="${escapeHTML(orgName)}" data-email="${escapeHTML(mergedData.contactEmail || '')}" data-contact-name="${escapeHTML(mergedData.contactName || '')}" onclick="event.stopPropagation(); sendThankYouEmailFromButton(this)">
                                ✉️ Send Thank You
                            </button>
                            <div class="expand-icon">▼</div>
                        </div>
                    </div>
                    <div class="card-body">
                `;

                // Show multiple response notice if applicable
                if (responses.length > 1) {
                    html += `
                        <div class="multiple-responses">
                            <div class="multiple-responses-title">📝 Multiple Responses Received</div>
                            <div class="response-list">
                                ${responses.map((r, i) =>
                                    `Response ${i + 1}: ${new Date(r.timestamp).toLocaleDateString()} at ${new Date(r.timestamp).toLocaleTimeString()}`
                                ).join('<br>')}
                            </div>
                        </div>
                    `;
                }

                // Info grid
                html += '<div class="info-grid">';

                // Schedule Section
                html += `
                    <div class="info-section">
                        <div class="info-section-title">🗓️ Schedule</div>
                        <div class="schedule-grid">
                            ${mergedData.feedingSchedule ? `
                                <div class="schedule-item">
                                    <div class="schedule-label">Meal Distribution</div>
                                    <div class="schedule-value">${escapeHTML(mergedData.feedingSchedule)}</div>
                                </div>
                            ` : ''}
                            ${mergedData.donationSchedule ? `
                                <div class="schedule-item">
                                    <div class="schedule-label">Donation Acceptance</div>
                                    <div class="schedule-value">${escapeHTML(mergedData.donationSchedule)}</div>
                                </div>
                            ` : ''}
                            ${!mergedData.feedingSchedule && !mergedData.donationSchedule ?
                                '<div class="info-value empty">No schedule provided</div>' : ''}
                        </div>
                    </div>
                `;

                // Contact Info Section
                html += `
                    <div class="info-section">
                        <div class="info-section-title">📞 Contact Information</div>
                        <div class="contact-list">
                            ${mergedData.contactName ? `
                                <div class="contact-item">
                                    <span class="contact-icon">👤</span>
                                    <span>${escapeHTML(mergedData.contactName)}</span>
                                </div>
                            ` : ''}
                            ${mergedData.contactEmail ? `
                                <div class="contact-item">
                                    <span class="contact-icon">✉️</span>
                                    <span>${escapeHTML(mergedData.contactEmail)}</span>
                                </div>
                            ` : ''}
                            ${mergedData.contactPhone ? `
                                <div class="contact-item">
                                    <span class="contact-icon">📱</span>
                                    <span>${escapeHTML(mergedData.contactPhone)}</span>
                                </div>
                            ` : ''}
                            ${mergedData.backupContactName ? `
                                <div class="contact-item">
                                    <span class="contact-icon">👤</span>
                                    <span>${escapeHTML(mergedData.backupContactName)} (Backup)</span>
                                </div>
                            ` : ''}
                            ${mergedData.backupContactEmail ? `
                                <div class="contact-item">
                                    <span class="contact-icon">✉️</span>
                                    <span>${escapeHTML(mergedData.backupContactEmail)} (Backup)</span>
                                </div>
                            ` : ''}
                            ${mergedData.backupContactPhone ? `
                                <div class="contact-item">
                                    <span class="contact-icon">📱</span>
                                    <span>${escapeHTML(mergedData.backupContactPhone)} (Backup)</span>
                                </div>
                            ` : ''}
                            ${primaryContactMethod ? `
                                <div class="contact-item">
                                    <span class="contact-icon">💬</span>
                                    <span><strong>Primary preferred:</strong> ${escapeHTML(primaryContactMethod)}</span>
                                </div>
                            ` : ''}
                            ${backupContactMethod ? `
                                <div class="contact-item">
                                    <span class="contact-icon">💬</span>
                                    <span><strong>Backup preferred:</strong> ${escapeHTML(backupContactMethod)}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;

                // Location Section
                const hasAddress = mergedData.streetAddress || mergedData.city || mergedData.state || mergedData.zipCode;
                html += `
                    <div class="info-section">
                        <div class="info-section-title">📍 Location</div>
                        ${hasAddress ? `
                            <div class="info-item">
                                ${escapeHTML(mergedData.streetAddress || '')}<br>
                                ${mergedData.addressLine2 ? escapeHTML(mergedData.addressLine2) + '<br>' : ''}
                                ${escapeHTML(mergedData.city || '')}${mergedData.city && mergedData.state ? ', ' : ''}${escapeHTML(mergedData.state || '')} ${escapeHTML(mergedData.zipCode || '')}
                            </div>
                        ` : '<div class="info-value empty">No address provided</div>'}
                        ${mergedData.serviceArea ? `
                            <div class="info-item">
                                <strong>Service Area:</strong> ${escapeHTML(mergedData.serviceArea)}
                            </div>
                        ` : ''}
                    </div>
                `;

                // Online Presence Section
                html += `
                    <div class="info-section">
                        <div class="info-section-title">🌐 Online Presence</div>
                        <div class="contact-list">
                            ${mergedData.website ? `
                                <div class="contact-item">
                                    <span class="contact-icon">🔗</span>
                                    ${websiteUrl ? `<a href="${escapeHTML(websiteUrl)}" target="_blank" rel="noopener noreferrer">${escapeHTML(mergedData.website)}</a>` : `<span>${escapeHTML(mergedData.website)}</span>`}
                                </div>
                            ` : ''}
                            ${mergedData.socialMedia ? `
                                <div class="contact-item">
                                    <span class="contact-icon">📱</span>
                                    <span>${escapeHTML(mergedData.socialMedia)}</span>
                                </div>
                            ` : ''}
                            ${!mergedData.website && !mergedData.socialMedia ?
                                '<div class="info-value empty">No online presence provided</div>' : ''}
                        </div>
                    </div>
                `;

                // Operations Section
                html += `
                    <div class="info-section">
                        <div class="info-section-title">📊 Operations</div>
                        ${mergedData.populationFocus ? `
                            <div class="info-item">
                                <strong>Population Focus:</strong> ${escapeHTML(mergedData.populationFocus)}
                            </div>
                        ` : ''}
                        ${mergedData.avgPeopleServed ? `
                            <div class="info-item">
                                <strong>Avg. People Served:</strong> ${escapeHTML(mergedData.avgPeopleServed)}
                            </div>
                        ` : ''}
                        ${mergedData.frequency ? `
                            <div class="info-item">
                                <strong>Frequency:</strong> ${escapeHTML(mergedData.frequency)}
                            </div>
                        ` : ''}
                        ${!mergedData.populationFocus && !mergedData.avgPeopleServed && !mergedData.frequency ?
                            '<div class="info-value empty">No operations info provided</div>' : ''}
                    </div>
                `;

                // Distribution & Storage Section
                const hasDistributionStorage = mergedData.distributionMethod ||
                    mergedData.takeHomeQuantity ||
                    mergedData.immediateRefrigeration ||
                    mergedData.refrigeratedUntilEaten ||
                    mergedData.freezeSandwiches ||
                    mergedData.freezeReason ||
                    mergedData.freezeDuration;
                html += `
                    <div class="info-section">
                        <div class="info-section-title">🥪 Distribution & Storage</div>
                        ${mergedData.distributionMethod ? `
                            <div class="info-item">
                                <strong>Distribution Method:</strong> ${escapeHTML(mergedData.distributionMethod)}
                            </div>
                        ` : ''}
                        ${mergedData.takeHomeQuantity ? `
                            <div class="info-item">
                                <strong>Take-home Quantity:</strong> ${escapeHTML(mergedData.takeHomeQuantity)}
                            </div>
                        ` : ''}
                        ${mergedData.immediateRefrigeration ? `
                            <div class="info-item">
                                <strong>Refrigerated Immediately:</strong> ${escapeHTML(mergedData.immediateRefrigeration)}
                            </div>
                        ` : ''}
                        ${mergedData.refrigeratedUntilEaten ? `
                            <div class="info-item">
                                <strong>Refrigerated Until Eaten/Distributed:</strong> ${escapeHTML(mergedData.refrigeratedUntilEaten)}
                            </div>
                        ` : ''}
                        ${mergedData.freezeSandwiches ? `
                            <div class="info-item">
                                <strong>Freezes Sandwiches:</strong> ${escapeHTML(mergedData.freezeSandwiches)}
                            </div>
                        ` : ''}
                        ${mergedData.freezeReason ? `
                            <div class="info-item">
                                <strong>Freeze Reason:</strong> ${escapeHTML(mergedData.freezeReason)}
                            </div>
                        ` : ''}
                        ${mergedData.freezeDuration ? `
                            <div class="info-item">
                                <strong>Freeze Duration:</strong> ${escapeHTML(mergedData.freezeDuration)}
                            </div>
                        ` : ''}
                        ${!hasDistributionStorage ?
                            '<div class="info-value empty">No distribution or storage info provided</div>' : ''}
                    </div>
                `;

                // Partnership Details Section
                html += `
                    <div class="info-section">
                        <div class="info-section-title">🤝 Partnership</div>
                        ${mergedData.yearsReceivingSandwiches ? `
                            <div class="info-item">
                                <strong>Partnership Length:</strong> ${escapeHTML(mergedData.yearsReceivingSandwiches)}
                            </div>
                        ` : ''}
                        ${mergedData.receivesFruitSnacks ? `
                            <div class="info-item">
                                <strong>Receives Fruit & Snacks:</strong> ${escapeHTML(mergedData.receivesFruitSnacks)}
                            </div>
                        ` : ''}
                        ${mergedData.fruitSnacksInterest ? `
                            <div class="info-item">
                                <strong>Interest in Fruit & Snacks:</strong> ${escapeHTML(mergedData.fruitSnacksInterest)}
                            </div>
                        ` : ''}
                        ${mergedData.deliveryRating ? `
                            <div class="info-item">
                                <strong>Delivery Rating:</strong> ${escapeHTML(mergedData.deliveryRating)}
                            </div>
                        ` : ''}
                        ${mergedData.deliveryFeedback ? `
                            <div class="info-item">
                                <strong>Delivery Feedback:</strong> ${escapeHTML(mergedData.deliveryFeedback)}
                            </div>
                        ` : ''}
                        ${mergedData.grantInterest ? `
                            <div class="info-item">
                                <strong>Grant Interest:</strong> ${escapeHTML(mergedData.grantInterest)}
                            </div>
                        ` : ''}
                    </div>
                `;

                html += '</div>'; // Close info-grid

                // Additional Information Sections
                if (mergedData.seasonalNeeds || mergedData.seasonalDetails) {
                    html += `
                        <div class="info-section" style="margin-top: 20px;">
                            <div class="info-section-title">🌡️ Seasonal Information</div>
                            ${mergedData.seasonalNeeds ? `
                                <div class="info-item">
                                    <strong>Seasonal Needs Change:</strong> ${escapeHTML(mergedData.seasonalNeeds)}
                                </div>
                            ` : ''}
                            ${mergedData.seasonalDetails ? `
                                <div class="info-item">
                                    <strong>Details:</strong> ${escapeHTML(mergedData.seasonalDetails)}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }

                if (mergedData.cannotServeSandwich || mergedData.restrictionReason) {
                    html += `
                        <div class="info-section" style="margin-top: 20px;">
                            <div class="info-section-title">⚠️ Restrictions</div>
                            ${mergedData.cannotServeSandwich ? `
                                <div class="info-item">
                                    <strong>Cannot Serve Sandwiches:</strong> ${escapeHTML(mergedData.cannotServeSandwich)}
                                </div>
                            ` : ''}
                            ${mergedData.restrictionReason ? `
                                <div class="info-item">
                                    <strong>Reason:</strong> ${escapeHTML(mergedData.restrictionReason)}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }

                if (mergedData.orgReferrals) {
                    html += `
                        <div class="info-section" style="margin-top: 20px;">
                            <div class="info-section-title">🔗 Referrals</div>
                            <div class="info-item">${escapeHTML(mergedData.orgReferrals)}</div>
                        </div>
                    `;
                }

                if (mergedData.impactStory) {
                    html += `
                        <div class="impact-story">
                            <div class="impact-story-title">💫 Impact Story</div>
                            <div class="impact-story-text">${escapeHTML(mergedData.impactStory)}</div>
                            ${mergedData.impactPhotos ? `
                                <div style="margin-top: 12px;">
                                    <strong>📷 Photos:</strong> ${escapeHTML(mergedData.impactPhotos)}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }

                if (mergedData.additionalInfo) {
                    html += `
                        <div class="info-section" style="margin-top: 20px;">
                            <div class="info-section-title">ℹ️ Additional Information</div>
                            <div class="info-item">${escapeHTML(mergedData.additionalInfo)}</div>
                        </div>
                    `;
                }

                html += `
                        <div class="timestamp-badge">
                            Last updated: ${new Date(latestResponse.timestamp).toLocaleDateString()} at ${new Date(latestResponse.timestamp).toLocaleTimeString()}
                        </div>
                    </div>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function mergeResponses(responses) {
            // Start with the most recent response and merge older ones
            const merged = { ...responses[0] };

            // For fields that are empty in the latest response, check older responses
            for (let i = 1; i < responses.length; i++) {
                const older = responses[i];
                Object.keys(older).forEach(key => {
                    if ((!merged[key] || merged[key] === '') && older[key] && older[key] !== '') {
                        merged[key] = older[key];
                    }
                });
            }

            return merged;
        }

        function toggleCard(header) {
            const body = header.nextElementSibling;
            const icon = header.querySelector('.expand-icon');

            body.classList.toggle('expanded');
            icon.classList.toggle('expanded');
        }

        function sendThankYouEmailFromButton(button) {
            sendThankYouEmail(
                button.dataset.orgName || '',
                button.dataset.email || '',
                button.dataset.contactName || ''
            );
        }

        function sendThankYouEmail(orgName, email, contactName) {
            if (!email) {
                alert(`No email address available for ${orgName}. Please add their contact email first.`);
                return;
            }

            const greeting = contactName ? `Dear ${contactName}` : `Dear ${orgName} Team`;

            const subject = `Thank You for Your Partnership with The Sandwich Project`;

            const body = `${greeting},

We're so grateful for you! Thank you so much for taking the time to complete our survey and share these valuable insights about your organization's logistics and your feedback.

Your dedication to serving our community is truly inspiring. The compassion and commitment you bring to your mission every day means so much, and we're deeply honored to support you in this important work.

The information you've shared helps us serve you better and ensure we're meeting your needs in meaningful ways. Your voice and partnership are invaluable to us.

Thank you for trusting us, for welcoming our sandwiches, and for the profound difference you make in so many lives. We're grateful to be your partners in nourishing our community.

With warmest appreciation,
The Sandwich Project Team

P.S. - We're always here if you need anything!`;

            // Use Gmail compose URL to open Gmail in a new window
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

            // Open in a popup window
            window.open(gmailUrl, 'gmailCompose', 'width=800,height=600,resizable=yes,scrollbars=yes');
        }

        function exportToCSV() {
            if (Object.keys(organizationData).length === 0) {
                alert('No data to export!');
                return;
            }

            // Create CSV headers
            const headers = [
                'Organization Name',
                'Number of Responses',
                'Last Updated',
                'Contact Name',
                'Contact Email',
                'Contact Phone',
                'Backup Contact Name',
                'Backup Contact Email',
                'Backup Contact Phone',
                'Primary Preferred Contact Method',
                'Backup Preferred Contact Method',
                'Street Address',
                'Address Line 2',
                'City',
                'State',
                'Zip Code',
                'Website',
                'Social Media',
                'Service Area',
                'Population Focus',
                'Meal Distribution Schedule',
                'Donation Acceptance Schedule',
                'Meal Schedule Input Type',
                'Donation Schedule Input Type',
                'Avg. People Served',
                'Frequency',
                'Distribution Method',
                'Take-home Quantity',
                'Refrigerated Immediately',
                'Refrigerated Until Eaten/Distributed',
                'Freezes Sandwiches',
                'Freeze Reason',
                'Freeze Duration',
                'Partnership Length',
                'Receives Fruit & Snacks',
                'Interest in Fruit & Snacks',
                'Delivery Rating',
                'Delivery Feedback',
                'Seasonal Needs Change',
                'Seasonal Details',
                'Cannot Serve Sandwiches',
                'Restriction Reason',
                'Grant Interest',
                'Referrals',
                'Impact Story',
                'Impact Photos',
                'Additional Info'
            ];

            // Create CSV rows
            const rows = [headers];

            Object.keys(organizationData).sort().forEach(orgName => {
                const responses = organizationData[orgName];
                const mergedData = mergeResponses(responses);
                const latestResponse = responses[0];
                const primaryContactMethod = mergedData.primaryContactMethod || mergedData.contactMethod;
                const backupContactMethod = mergedData.backupContactMethod;

                const escapeCSV = (value) => {
                    if (!value) return '';
                    let str = value.toString();
                    if (/^[=+\-@]/.test(str.trimStart())) {
                        str = `'${str}`;
                    }
                    str = str.replace(/"/g, '""');
                    const needsQuotes = str.includes(',') || str.includes('\n') || str.includes('\r') || str.includes('"');
                    return needsQuotes ? `"${str}"` : str;
                };

                const row = [
                    escapeCSV(orgName),
                    responses.length,
                    escapeCSV(new Date(latestResponse.timestamp).toLocaleString()),
                    escapeCSV(mergedData.contactName),
                    escapeCSV(mergedData.contactEmail),
                    escapeCSV(mergedData.contactPhone),
                    escapeCSV(mergedData.backupContactName),
                    escapeCSV(mergedData.backupContactEmail),
                    escapeCSV(mergedData.backupContactPhone),
                    escapeCSV(primaryContactMethod),
                    escapeCSV(backupContactMethod),
                    escapeCSV(mergedData.streetAddress),
                    escapeCSV(mergedData.addressLine2),
                    escapeCSV(mergedData.city),
                    escapeCSV(mergedData.state),
                    escapeCSV(mergedData.zipCode),
                    escapeCSV(mergedData.website),
                    escapeCSV(mergedData.socialMedia),
                    escapeCSV(mergedData.serviceArea),
                    escapeCSV(mergedData.populationFocus),
                    escapeCSV(mergedData.feedingSchedule),
                    escapeCSV(mergedData.donationSchedule),
                    escapeCSV(mergedData.feedingScheduleInputType),
                    escapeCSV(mergedData.donationScheduleInputType),
                    escapeCSV(mergedData.avgPeopleServed),
                    escapeCSV(mergedData.frequency),
                    escapeCSV(mergedData.distributionMethod),
                    escapeCSV(mergedData.takeHomeQuantity),
                    escapeCSV(mergedData.immediateRefrigeration),
                    escapeCSV(mergedData.refrigeratedUntilEaten),
                    escapeCSV(mergedData.freezeSandwiches),
                    escapeCSV(mergedData.freezeReason),
                    escapeCSV(mergedData.freezeDuration),
                    escapeCSV(mergedData.yearsReceivingSandwiches),
                    escapeCSV(mergedData.receivesFruitSnacks),
                    escapeCSV(mergedData.fruitSnacksInterest),
                    escapeCSV(mergedData.deliveryRating),
                    escapeCSV(mergedData.deliveryFeedback),
                    escapeCSV(mergedData.seasonalNeeds),
                    escapeCSV(mergedData.seasonalDetails),
                    escapeCSV(mergedData.cannotServeSandwich),
                    escapeCSV(mergedData.restrictionReason),
                    escapeCSV(mergedData.grantInterest),
                    escapeCSV(mergedData.orgReferrals),
                    escapeCSV(mergedData.impactStory),
                    escapeCSV(mergedData.impactPhotos),
                    escapeCSV(mergedData.additionalInfo)
                ];

                rows.push(row);
            });

            // Convert to CSV string
            const csvContent = rows.map(row => row.join(',')).join('\n');

            // Download
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `partner-organizations-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        // Load on page load
        loadResponses();
    </script>
</body>
</html>
